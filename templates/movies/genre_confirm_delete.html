{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; margin-top: 2rem; text-align: center;">
    <h2 style="color: #ef4444; margin-bottom: 1rem;">⚠️ Delete Genre</h2>
    
    <p style="font-size: 1.1rem; margin-bottom: 2rem;">
        Are you sure you want to delete the genre <strong>«{{ object.name }}»</strong>?<br>
        <span style="color: var(--text-muted); font-size: 0.9rem;">Movies with this genre will remain, but the tag will be removed.</span>
    </p>

    <form method="post" style="display: flex; gap: 1rem; justify-content: center;">
        {% csrf_token %}
        
        <button type="submit" class="btn" style="background-color: #ef4444; color: white;">
            Yes, delete
        </button>
        
        <a href="{% url 'genre_detail' object.pk %}" class="btn" style="background-color: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);">
            No, keep
        </a>
    </form>
</div>
{% endblock %}
