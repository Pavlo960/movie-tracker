{% extends 'base.html' %} <!-- Change to 'movies/base.html' if you have a different structure -->

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; margin-top: 2rem;">
    <!-- This condition is what makes the template universal -->
    <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
        {% if object %}
            Edit Movie «{{ object.title }}»
        {% else %}
            🎬 Add New Movie
        {% endif %}
    </h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- CSRF PROTECTION (without it Django will throw a 403 error) -->
        {% csrf_token %}
        
        <!-- Django will render all inputs, dropdowns, and calendars automatically -->
        <div style="line-height: 2; color: var(--text-muted);">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn" style="margin-top: 1rem;">Save Record</button>
        
        <!-- Back button -->
        <a href="javascript:history.back()" style="text-align: center; color: var(--text-muted); text-decoration: none; margin-top: 1rem;">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
